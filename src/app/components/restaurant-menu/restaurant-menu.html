@if(categories(); as categories){
    @for(category of categories; track category.id){
        <section>
            <h2>{{ category.name }} </h2>

            @for(product of category.products; track product.id){
                <div class="product-row">
                <span><a [routerLink]="['productdetails', product.id]">{{ product.name }}</a></span>
                <button class="add-to-cart" (click)="AddToCart(product.id)">Dodaj do koszyka!</button>
                
                </div>
            }

        </section>
    }
}
