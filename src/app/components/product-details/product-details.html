@if(product() !== undefined && product() !== null){
    <h2>{{product()?.name}}</h2>
    <h3>{{product()?.description}}</h3>
    <p>Cena: {{product()?.price}} USD</p>
    <img [src]="product()?.imageUrl"/>
    <p>Status: @if(product()?.available){Available} @else{Not available} </p>
} @else {
    <p>Product not found</p>
}
